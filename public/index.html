<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SoulLink Tracker</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 0;
}

header {
    background: #d62828;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

input {
    padding: 10px;
    margin: 5px;
    border-radius: 10px;
    border: 1px solid #ddd;
    width: calc(25% - 12px);
}

#route {
    width: calc(100% - 12px);
}

button {
    margin-top: 10px;
    background: #d62828;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 25px;
    width: 100%;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #a61c1c;
}

.search {
    width: 100%;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th {
    background: #d62828;
    color: white;
    padding: 10px;
    text-align: left;
}

td {
    padding: 10px;
    border-bottom: 1px solid #eee;
}

tr:hover {
    background: #f9f9f9;
}
</style>
</head>

<body>

<header>
    SoulLink Tracker
</header>

<div class="container">

    <!-- Eingabe -->
    <div class="card">
        <input id="route" placeholder="Route">

        <div>
            <input id="janik" placeholder="Janik">
            <input id="tim" placeholder="Tim">
            <input id="nils" placeholder="Nils">
            <input id="niki" placeholder="Niki">
        </div>

        <button onclick="send()">Speichern</button>
    </div>

    <!-- Suche -->
    <div class="card">
        <input id="search" class="search" placeholder="Suchen..." oninput="loadData()">
    </div>

    <!-- Tabelle -->
    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Route</th>
                    <th>Spieler</th>
                    <th>Pokémon</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

</div>

<script>
function send() {
    const route = document.getElementById("route").value;

    const players = [
        { player: "Janik", pokemonName: document.getElementById("janik").value },
        { player: "Tim", pokemonName: document.getElementById("tim").value },
        { player: "Nils", pokemonName: document.getElementById("nils").value },
        { player: "Niki", pokemonName: document.getElementById("niki").value }
    ];

    players.forEach(p => {
        fetch("/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                location: route,
                player: p.player,
                pokemonName: p.pokemonName
            })
        });
    });

    setTimeout(loadData, 300);
}

async function loadData() {
    const res = await fetch("/data");
    const data = await res.json();

    const search = document.getElementById("search").value.toLowerCase();

    const table = document.getElementById("tableBody");
    table.innerHTML = "";

    data
    .filter(e =>
        e.location.toLowerCase().includes(search) ||
        e.player.toLowerCase().includes(search) ||
        e.pokemonName.toLowerCase().includes(search)
    )
    .reverse()
    .forEach(e => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${e.location}</td>
            <td>${e.player}</td>
            <td>${e.pokemonName}</td>
        `;

        table.appendChild(row);
    });
}

loadData();
</script>

</body>
</html>

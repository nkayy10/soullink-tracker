<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SoulLink Tracker</title>

<style>
:root {
    --red: #e63946;
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e5e7eb;
}

body {
    margin: 0;
    font-family: system-ui;
    background: var(--bg);
    color: var(--text);
}

/* LOGIN SCREEN */
.login {
    display: flex;
    height: 100vh;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: var(--card);
    padding: 30px;
    border-radius: 16px;
    width: 300px;
    text-align: center;
}

.hidden {
    display: none;
}

/* APP */
header {
    background: #020617;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: var(--card);
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 20px;
}

/* INPUT FIX */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #020617;
    color: white;
}

/* BUTTON */
.btn {
    padding: 10px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    margin-top: 10px;
}

.primary {
    background: var(--red);
    color: white;
}

.secondary {
    background: #334155;
    color: white;
}

/* TABLE */
table {
    width: 100%;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    text-align: center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login">
    <div class="login-box">
        <h3>Login</h3>
        <input id="passwordInput" type="password" placeholder="Passwort">
        <button class="btn primary" onclick="login()">Einloggen</button>
        <p id="error" style="color:red;"></p>
    </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<header>
    <div>SoulLink Tracker</div>
</header>

<div class="container">

<div class="card">
    <input id="route" placeholder="Route">

    <div class="grid">
        <input id="janik" placeholder="Janik">
        <input id="tim" placeholder="Tim">
        <input id="nils" placeholder="Nils">
        <input id="niki" placeholder="Niki">
    </div>

    <button class="btn primary" onclick="send()">Speichern</button>
</div>

<div class="card">
    <input id="search" placeholder="Suchen..." oninput="loadData()">
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Route</th>
                <th>Janik</th>
                <th>Tim</th>
                <th>Nils</th>
                <th>Niki</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

</div>
</div>

<script>
let PASSWORD = "";

// LOGIN
function login() {
    const input = document.getElementById("passwordInput").value;

    fetch("/data", {
        headers: { "x-password": input }
    })
    .then(res => {
        if (res.status === 401) {
            document.getElementById("error").innerText = "Falsches Passwort";
        } else {
            PASSWORD = input;
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("app").classList.remove("hidden");
            loadData();
        }
    });
}

// SEND
function send() {
    const route = document.getElementById("route").value;

    const players = [
        { player: "Janik", pokemonName: document.getElementById("janik").value },
        { player: "Tim", pokemonName: document.getElementById("tim").value },
        { player: "Nils", pokemonName: document.getElementById("nils").value },
        { player: "Niki", pokemonName: document.getElementById("niki").value }
    ];

    players.forEach(p => {
        fetch("/add", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-password": PASSWORD
            },
            body: JSON.stringify({
                location: route,
                player: p.player,
                pokemonName: p.pokemonName
            })
        });
    });

    // reset
    document.querySelectorAll("input").forEach(i => i.value = "");

    setTimeout(loadData, 200);
}

// LOAD
async function loadData() {
    const res = await fetch("/data", {
        headers: { "x-password": PASSWORD }
    });

    const data = await res.json();

    const grouped = {};

    data.forEach(e => {
        if (!grouped[e.location]) {
            grouped[e.location] = { Janik: "", Tim: "", Nils: "", Niki: "" };
        }
        grouped[e.location][e.player] = e.pokemonName;
    });

    const table = document.getElementById("tableBody");
    table.innerHTML = "";

    Object.keys(grouped).forEach(route => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${route}</td>
            <td>${grouped[route].Janik}</td>
            <td>${grouped[route].Tim}</td>
            <td>${grouped[route].Nils}</td>
            <td>${grouped[route].Niki}</td>
        `;
        table.appendChild(row);
    });
}
</script>

</body>
</html>

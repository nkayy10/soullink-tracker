<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SoulLink Tracker</title>

<style>
:root {
    --red: #e63946;
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e5e7eb;
}

body {
    margin: 0;
    font-family: system-ui;
    background: var(--bg);
    color: var(--text);
}

/* HEADER */
header {
    background: #020617;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
}

.title {
    font-weight: 600;
}

/* MENU */
.menu {
    position: relative;
}

.menu-btn {
    background: var(--card);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
}

.menu-content {
    display: none;
    position: absolute;
    right: 0;
    background: var(--card);
    padding: 10px;
    border-radius: 10px;
    width: 200px;
}

.menu:hover .menu-content {
    display: block;
}

/* LAYOUT */
.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: var(--card);
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 20px;
}

/* INPUT */
input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #020617;
    color: white;
    margin-bottom: 10px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* BUTTON */
.btn {
    padding: 10px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}

.primary {
    background: var(--red);
    color: white;
}

.secondary {
    background: #334155;
    color: white;
}

/* TABLE */
table {
    width: 100%;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    text-align: center;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
}

.modal-content {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    width: 300px;
    margin: 15% auto;
}
</style>
</head>

<body>

<header>
    <div class="title">SoulLink Tracker</div>

    <div class="menu">
        <button class="menu-btn">Backup</button>
        <div class="menu-content">
            <button onclick="downloadData()">Download</button>
            <input type="file" onchange="uploadData(event)">
        </div>
    </div>
</header>

<div class="container">

<div class="card">
    <input id="route" placeholder="Route">

    <div class="grid">
        <input id="janik" placeholder="Janik">
        <input id="tim" placeholder="Tim">
        <input id="nils" placeholder="Nils">
        <input id="niki" placeholder="Niki">
    </div>

    <button class="btn primary" onclick="send()">Speichern</button>
    <button class="btn secondary" onclick="openModal()">Run löschen</button>
</div>

<div class="card">
    <input id="search" placeholder="Suchen..." oninput="loadData()">
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Route</th>
                <th>Janik</th>
                <th>Tim</th>
                <th>Nils</th>
                <th>Niki</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <p>"gugugaga" eingeben</p>
        <input id="confirmText">
        <button onclick="confirmReset()">Bestätigen</button>
        <button onclick="closeModal()">Abbrechen</button>
    </div>
</div>

<script>

// 🔐 LOGIN
let PASSWORD = "";

function login() {
    PASSWORD = prompt("Passwort eingeben:");

    if (!PASSWORD) {
        alert("Kein Zugriff");
    }
}

login();

// SEND
function send() {
    const route = document.getElementById("route").value;

    const players = [
        { player: "Janik", pokemonName: document.getElementById("janik").value },
        { player: "Tim", pokemonName: document.getElementById("tim").value },
        { player: "Nils", pokemonName: document.getElementById("nils").value },
        { player: "Niki", pokemonName: document.getElementById("niki").value }
    ];

    players.forEach(p => {
        fetch("/add", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-password": PASSWORD
            },
            body: JSON.stringify({
                location: route,
                player: p.player,
                pokemonName: p.pokemonName
            })
        });
    });

    // reset inputs
    document.getElementById("route").value = "";
    document.getElementById("janik").value = "";
    document.getElementById("tim").value = "";
    document.getElementById("nils").value = "";
    document.getElementById("niki").value = "";

    setTimeout(loadData, 200);
}

// LOAD
async function loadData() {
    const res = await fetch("/data", {
        headers: { "x-password": PASSWORD }
    });

    const data = await res.json();
    const search = document.getElementById("search").value.toLowerCase();

    const grouped = {};

    data.forEach(e => {
        if (!grouped[e.location]) {
            grouped[e.location] = { Janik: "", Tim: "", Nils: "", Niki: "" };
        }
        grouped[e.location][e.player] = e.pokemonName;
    });

    const table = document.getElementById("tableBody");
    table.innerHTML = "";

    Object.keys(grouped)
    .filter(route =>
        route.toLowerCase().includes(search) ||
        Object.values(grouped[route]).join("").toLowerCase().includes(search)
    )
    .reverse()
    .forEach(route => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${route}</td>
            <td>${grouped[route].Janik}</td>
            <td>${grouped[route].Tim}</td>
            <td>${grouped[route].Nils}</td>
            <td>${grouped[route].Niki}</td>
        `;
        table.appendChild(row);
    });
}

// RESET
function openModal() {
    document.getElementById("modal").style.display = "block";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

function confirmReset() {
    if (document.getElementById("confirmText").value === "gugugaga") {
        fetch("/reset", {
            method: "DELETE",
            headers: { "x-password": PASSWORD }
        }).then(() => {
            closeModal();
            loadData();
        });
    } else {
        alert("Falsch");
    }
}

// BACKUP
function downloadData() {
    fetch("/data", {
        headers: { "x-password": PASSWORD }
    })
    .then(res => res.json())
    .then(data => {
        const blob = new Blob([JSON.stringify(data, null, 2)]);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "backup.json";
        a.click();
    });
}

function uploadData(e) {
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(evt) {
        const json = JSON.parse(evt.target.result);

        fetch("/import", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-password": PASSWORD
            },
            body: JSON.stringify(json)
        }).then(loadData);
    };

    reader.readAsText(file);
}

loadData();
</script>

</body>
</html>

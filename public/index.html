<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoulLink Tracker</title>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e5e7eb;
}

body {
    margin: 0;
    font-family: system-ui;
    background: var(--bg);
    color: var(--text);
}

/* LOGIN */
.login {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: var(--card);
    padding: 25px;
    border-radius: 15px;
    width: 300px;
}

/* APP */
.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.card {
    background: var(--card);
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

input, select {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #020617;
    color: white;
}

button {
    padding: 10px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    margin-top: 10px;
}

.primary { background: green; color: white; }
.danger { background: red; color: white; }

/* TABLE */
table { width: 100%; }
th, td { padding: 10px; border-bottom: 1px solid var(--border); }

.dead-row td {
    opacity: 0.5;
    text-decoration: line-through;
}

/* STATUS */
.status-btn {
    cursor: pointer;
    font-size: 18px;
}

/* RANKING */
#ranking { margin-bottom: 30px; }

.ranking-item {
    display: flex;
    justify-content: space-between;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
}

.modal.show {
    display: flex;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    width: 300px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login">
    <div class="login-box">
        <h3>Login</h3>
        <input id="passwordInput" type="password">
        <button onclick="login()">Login</button>
        <p id="loginError"></p>
    </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<div class="container">

<div class="card">
    <h3>Ranking</h3>
    <div id="ranking"></div>
</div>

<div class="card">
    <input id="route" placeholder="Route">

    <div class="grid">
        <input id="janik" placeholder="Janik">
        <input id="tim" placeholder="Tim">
        <input id="nils" placeholder="Nils">
        <input id="niki" placeholder="Niki">
    </div>

    <button class="primary" onclick="send()">Speichern</button>
    <button class="danger" onclick="resetRun()">Run löschen</button>
</div>

<div class="card">
    <input id="search" placeholder="Suchen..." oninput="renderTable()">
</div>

<div class="card">
<table>
<thead>
<tr>
<th>Status</th>
<th>Route</th>
<th>Janik</th>
<th>Tim</th>
<th>Nils</th>
<th>Niki</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

</div>

</div>

<!-- KILL MODAL -->
<div id="killModal" class="modal">
<div class="modal-content">
<h3>Wer hat geblowt?</h3>
<select id="killer">
<option>Janik</option>
<option>Tim</option>
<option>Nils</option>
<option>Niki</option>
</select>
<button onclick="confirmKill()">Bestätigen</button>
<button onclick="closeKillModal()">Abbrechen</button>
</div>
</div>

<script>

let PASSWORD = "";
let rawData = [];
let currentRoute = "";

// LOGIN
async function login() {
    const input = document.getElementById("passwordInput").value;

    const res = await fetch("/data", {
        headers: { "x-password": input }
    });

    if (res.status === 401) {
        document.getElementById("loginError").innerText = "Falsch";
        return;
    }

    PASSWORD = input;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";

    loadData();
}

// SAVE
async function send() {
    const route = document.getElementById("route").value;

    const players = [
        { player: "Janik", pokemonName: document.getElementById("janik").value },
        { player: "Tim", pokemonName: document.getElementById("tim").value },
        { player: "Nils", pokemonName: document.getElementById("nils").value },
        { player: "Niki", pokemonName: document.getElementById("niki").value }
    ];

    await Promise.all(players.map(p =>
        fetch("/add", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "x-password": PASSWORD
            },
            body: JSON.stringify({
                location: route,
                player: p.player,
                pokemonName: p.pokemonName
            })
        })
    ));

    document.querySelectorAll("input").forEach(i => i.value = "");

    loadData();
}

// LOAD
async function loadData() {
    const res = await fetch("/data", {
        headers: { "x-password": PASSWORD }
    });

    rawData = await res.json();
    renderTable();
}

// TABLE
function renderTable() {
    const grouped = {};

    rawData.forEach(e => {
        if (!grouped[e.location]) {
            grouped[e.location] = {
                Janik:"", Tim:"", Nils:"", Niki:"",
                dead:false, cause:null
            };
        }

        grouped[e.location][e.player] = e.pokemonName;

        if (e.dead) {
            grouped[e.location].dead = true;
            grouped[e.location].cause = e.cause;
        }
    });

    const table = document.getElementById("tableBody");
    table.innerHTML = "";

    Object.keys(grouped).forEach(route => {
        const row = grouped[route];

        const tr = document.createElement("tr");
        if (row.dead) tr.classList.add("dead-row");

        tr.innerHTML = `
<td class="status-btn" onclick="handleStatus('${route}')">
${row.dead ? "🔴" : "🟢"}
</td>
<td>${route}</td>
<td>${row.Janik}</td>
<td>${row.Tim}</td>
<td>${row.Nils}</td>
<td>${row.Niki}</td>
`;

        table.appendChild(tr);
    });

    // RANKING
    const ranking = { Janik:0, Tim:0, Nils:0, Niki:0 };

    Object.values(grouped).forEach(r => {
        if (r.dead && r.cause) ranking[r.cause]++;
    });

    const div = document.getElementById("ranking");
    div.innerHTML = "";

    Object.entries(ranking)
    .sort((a,b)=>b[1]-a[1])
    .forEach(([name,score])=>{
        const el=document.createElement("div");
        el.className="ranking-item";
        el.innerHTML=`<span>${name}</span><span>${score}</span>`;
        div.appendChild(el);
    });
}

// STATUS CLICK
function handleStatus(route) {
    const isDead = rawData.some(e => e.location === route && e.dead);

    if (isDead) {
        revive(route);
    } else {
        currentRoute = route;
        document.getElementById("killModal").classList.add("show");
    }
}

// KILL
async function confirmKill() {
    const killer = document.getElementById("killer").value;

    const updated = rawData.map(e => {
        if (e.location === currentRoute) {
            return { ...e, dead:true, cause:killer };
        }
        return e;
    });

    await fetch("/import", {
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "x-password":PASSWORD
        },
        body:JSON.stringify(updated)
    });

    closeKillModal();
    loadData();
}

function closeKillModal() {
    document.getElementById("killModal").classList.remove("show");
}

// REVIVE
async function revive(route) {
    const updated = rawData.map(e => {
        if (e.location === route) {
            return { ...e, dead:false, cause:null };
        }
        return e;
    });

    await fetch("/import", {
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "x-password":PASSWORD
        },
        body:JSON.stringify(updated)
    });

    loadData();
}

// RESET
async function resetRun() {
    if (prompt("gugugaga eingeben") !== "gugugaga") return;

    await fetch("/reset", {
        method:"DELETE",
        headers:{ "x-password":PASSWORD }
    });

    loadData();
}

</script>

</body>
</html>

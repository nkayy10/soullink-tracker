<!DOCTYPE html>
<html>
<head>
    <title>SoulLink Tracker</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }

        h1 {
            color: #d62828;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        button {
            background: #d62828;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #a61c1c;
        }

        .list {
            margin-top: 20px;
        }

        .entry {
            background: white;
            margin: 10px auto;
            padding: 10px;
            width: 300px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>🔥 SoulLink Tracker 🔥</h1>

<div class="card">
    <input id="route" placeholder="Route"><br>

    <input id="janik" placeholder="Janik">
    <input id="tim" placeholder="Tim">
    <input id="nils" placeholder="Nils">
    <input id="niki" placeholder="Niki"><br>

    <button onclick="send()">Speichern</button>
</div>

<div class="card">
    <input id="search" placeholder="🔍 Suchen..." oninput="loadData()">
</div>

<div class="list" id="list"></div>

<script>
function send() {
    const route = document.getElementById("route").value;

    const players = [
        { player: "Janik", pokemonName: document.getElementById("janik").value },
        { player: "Tim", pokemonName: document.getElementById("tim").value },
        { player: "Nils", pokemonName: document.getElementById("nils").value },
        { player: "Niki", pokemonName: document.getElementById("niki").value }
    ];

    players.forEach(p => {
        fetch("/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                location: route,
                player: p.player,
                pokemonName: p.pokemonName
            })
        });
    });

    alert("Gespeichert!");
    setTimeout(loadData, 500);
}

async function loadData() {
    const res = await fetch("/data");
    const data = await res.json();

    const search = document.getElementById("search").value.toLowerCase();

    const list = document.getElementById("list");
    list.innerHTML = "";

    data
    .filter(e =>
        e.location.toLowerCase().includes(search) ||
        e.player.toLowerCase().includes(search) ||
        e.pokemonName.toLowerCase().includes(search)
    )
    .reverse()
    .forEach(e => {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `
            <b>${e.location}</b><br>
            ${e.player}: ${e.pokemonName}
        `;
        list.appendChild(div);
    });
}

loadData();
</script>

</body>
</html>

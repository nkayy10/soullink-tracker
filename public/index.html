<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SoulLink Tracker</title>

<style>
body {
    font-family: Arial;
    background: #f4f6f8;
    margin: 0;
}

header {
    background: #d62828;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 24px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

input {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
    width: 100%;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

button {
    margin-top: 10px;
    background: #d62828;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 25px;
    width: 100%;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #a61c1c;
}

.reset-btn {
    background: #333;
}

.reset-btn:hover {
    background: black;
}

.search {
    width: 100%;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #d62828;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #eee;
}

tr:hover {
    background: #f9f9f9;
}

/* Popup */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
}

.modal-content {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 300px;
    margin: 15% auto;
    text-align: center;
}
</style>
</head>

<body>

<header>SoulLink Tracker</header>

<div class="container">

    <!-- Eingabe -->
    <div class="card">
        <input id="route" placeholder="Route">

        <div class="grid">
            <input id="janik" placeholder="Janik">
            <input id="tim" placeholder="Tim">
            <input id="nils" placeholder="Nils">
            <input id="niki" placeholder="Niki">
        </div>

        <button onclick="send()">Speichern</button>
        <button class="reset-btn" onclick="openModal()">Run löschen</button>
    </div>

    <!-- Suche -->
    <div class="card">
        <input id="search" class="search" placeholder="Suchen..." oninput="loadData()">
    </div>

    <!-- Tabelle -->
    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Route</th>
                    <th>Spieler</th>
                    <th>Pokémon</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

</div>

<!-- Popup -->
<div id="modal" class="modal">
    <div class="modal-content">
        <p>Zum Löschen "gugugaga" eingeben:</p>
        <input id="confirmText">
        <button onclick="confirmReset()">Bestätigen</button>
    </div>
</div>

<script>
function send() {
    const route = document.getElementById("route").value;

    const players = [
        { player: "Janik", pokemonName: document.getElementById("janik").value },
        { player: "Tim", pokemonName: document.getElementById("tim").value },
        { player: "Nils", pokemonName: document.getElementById("nils").value },
        { player: "Niki", pokemonName: document.getElementById("niki").value }
    ];

    players.forEach(p => {
        fetch("/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                location: route,
                player: p.player,
                pokemonName: p.pokemonName
            })
        });
    });

    setTimeout(loadData, 300);
}

async function loadData() {
    const res = await fetch("/data");
    const data = await res.json();

    const search = document.getElementById("search").value.toLowerCase();

    const table = document.getElementById("tableBody");
    table.innerHTML = "";

    data
    .filter(e =>
        e.location.toLowerCase().includes(search) ||
        e.player.toLowerCase().includes(search) ||
        e.pokemonName.toLowerCase().includes(search)
    )
    .reverse()
    .forEach(e => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${e.location}</td>
            <td>${e.player}</td>
            <td>${e.pokemonName}</td>
        `;
        table.appendChild(row);
    });
}

function openModal() {
    document.getElementById("modal").style.display = "block";
}

function confirmReset() {
    const text = document.getElementById("confirmText").value;

    if (text === "gugugaga") {
        fetch("/reset", { method: "DELETE" })
        .then(() => {
            document.getElementById("modal").style.display = "none";
            loadData();
        });
    } else {
        alert("Falsches Wort");
    }
}

loadData();
</script>

</body>
</html>

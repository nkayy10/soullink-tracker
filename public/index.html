<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SoulLink Tracker</title>

<style>
body {
    font-family: Arial;
    background: #f4f6f8;
    margin: 0;
}

header {
    background: #d62828;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 24px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

input {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
    width: 100%;
}

button {
    margin-top: 10px;
    background: #d62828;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 25px;
    width: 100%;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #a61c1c;
}

.secondary {
    background: #555;
}

.secondary:hover {
    background: #333;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #d62828;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #eee;
    text-align: center;
}

tr:hover {
    background: #f9f9f9;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
}

.modal-content {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 300px;
    margin: 15% auto;
    text-align: center;
}
</style>
</head>

<body>

<header>SoulLink Tracker</header>

<div class="container">

<!-- Eingabe -->
<div class="card">
    <input id="route" placeholder="Route">

    <div class="grid">
        <input id="janik" placeholder="Janik">
        <input id="tim" placeholder="Tim">
        <input id="nils" placeholder="Nils">
        <input id="niki" placeholder="Niki">
    </div>

    <button onclick="send()">Speichern</button>
    <button class="secondary" onclick="openModal()">Run löschen</button>
</div>

<!-- Backup -->
<div class="card">
    <button onclick="downloadData()">Backup herunterladen</button>
    <input type="file" onchange="uploadData(event)">
</div>

<!-- Tabelle -->
<div class="card">
    <table>
        <thead>
            <tr>
                <th>Route</th>
                <th>Janik</th>
                <th>Tim</th>
                <th>Nils</th>
                <th>Niki</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <p>"gugugaga" eingeben zum Löschen</p>
        <input id="confirmText">
        <button onclick="confirmReset()">Bestätigen</button>
    </div>
</div>

<script>
function send() {
    const route = document.getElementById("route").value;

    const players = [
        { player: "Janik", pokemonName: document.getElementById("janik").value },
        { player: "Tim", pokemonName: document.getElementById("tim").value },
        { player: "Nils", pokemonName: document.getElementById("nils").value },
        { player: "Niki", pokemonName: document.getElementById("niki").value }
    ];

    players.forEach(p => {
        fetch("/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                location: route,
                player: p.player,
                pokemonName: p.pokemonName
            })
        });
    });

    setTimeout(loadData, 200);
}

// Gruppieren nach Route
async function loadData() {
    const res = await fetch("/data");
    const data = await res.json();

    const grouped = {};

    data.forEach(e => {
        if (!grouped[e.location]) {
            grouped[e.location] = {
                Janik: "",
                Tim: "",
                Nils: "",
                Niki: ""
            };
        }

        grouped[e.location][e.player] = e.pokemonName;
    });

    const table = document.getElementById("tableBody");
    table.innerHTML = "";

    Object.keys(grouped).reverse().forEach(route => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${route}</td>
            <td>${grouped[route].Janik}</td>
            <td>${grouped[route].Tim}</td>
            <td>${grouped[route].Nils}</td>
            <td>${grouped[route].Niki}</td>
        `;

        table.appendChild(row);
    });
}

// Reset
function openModal() {
    document.getElementById("modal").style.display = "block";
}

function confirmReset() {
    const text = document.getElementById("confirmText").value;

    if (text === "gugugaga") {
        fetch("/reset", { method: "DELETE" })
        .then(() => {
            document.getElementById("modal").style.display = "none";
            loadData();
        });
    } else {
        alert("Falsches Wort");
    }
}

// Download
function downloadData() {
    fetch("/data")
    .then(res => res.json())
    .then(data => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "soullink-backup.json";
        a.click();
    });
}

// Upload
function uploadData(event) {
    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const json = JSON.parse(e.target.result);

        fetch("/import", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(json)
        }).then(loadData);
    };

    reader.readAsText(file);
}

loadData();
</script>

</body>
</html>

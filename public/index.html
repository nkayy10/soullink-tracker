<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>SoulLink Tracker</title>

<style>
:root {
    --red: #d62828;
    --red-dark: #a61c1c;
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #222;
    --border: #e5e7eb;
}

body {
    font-family: system-ui, Arial;
    background: var(--bg);
    margin: 0;
    color: var(--text);
}

header {
    background: var(--red);
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: 600;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.05);
}

/* INPUT */
.label {
    font-size: 13px;
    margin-bottom: 5px;
    display: block;
    color: #666;
}

input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    font-size: 14px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* BUTTONS */
.btn {
    padding: 10px;
    border-radius: 20px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
}

.primary {
    background: var(--red);
    color: white;
}

.primary:hover {
    background: var(--red-dark);
}

.secondary {
    background: #eee;
}

.secondary:hover {
    background: #ddd;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

th {
    text-align: left;
    padding: 10px;
    font-size: 13px;
    color: #666;
    border-bottom: 2px solid var(--border);
}

td {
    padding: 12px 10px;
    border-bottom: 1px solid var(--border);
}

tr:hover {
    background: #fafafa;
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
}

.modal-content {
    background: white;
    padding: 20px;
    border-radius: 14px;
    width: 300px;
    margin: 15% auto;
}
</style>
</head>

<body>

<header>SoulLink Tracker</header>

<div class="container">

<!-- Eingabe -->
<div class="card">

    <label class="label">Route</label>
    <input id="route" placeholder="z. B. Route 1">

    <div class="grid">
        <div>
            <label class="label">Janik</label>
            <input id="janik">
        </div>

        <div>
            <label class="label">Tim</label>
            <input id="tim">
        </div>

        <div>
            <label class="label">Nils</label>
            <input id="nils">
        </div>

        <div>
            <label class="label">Niki</label>
            <input id="niki">
        </div>
    </div>

    <button class="btn primary" onclick="send()">Speichern</button>
    <button class="btn secondary" onclick="openModal()">Run löschen</button>

</div>

<!-- Backup -->
<div class="card">
    <button class="btn secondary" onclick="downloadData()">Backup herunterladen</button>
    <input type="file" onchange="uploadData(event)">
</div>

<!-- Tabelle -->
<div class="card">
    <table>
        <thead>
            <tr>
                <th>Route</th>
                <th>Janik</th>
                <th>Tim</th>
                <th>Nils</th>
                <th>Niki</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <p>"gugugaga" eingeben zum Löschen</p>
        <input id="confirmText">
        <button class="btn primary" onclick="confirmReset()">Bestätigen</button>
    </div>
</div>

<script>
// SEND
function send() {
    const route = document.getElementById("route").value;

    const players = [
        { player: "Janik", pokemonName: document.getElementById("janik").value },
        { player: "Tim", pokemonName: document.getElementById("tim").value },
        { player: "Nils", pokemonName: document.getElementById("nils").value },
        { player: "Niki", pokemonName: document.getElementById("niki").value }
    ];

    players.forEach(p => {
        fetch("/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                location: route,
                player: p.player,
                pokemonName: p.pokemonName
            })
        });
    });

    setTimeout(loadData, 200);
}

// LOAD + GROUP
async function loadData() {
    const res = await fetch("/data");
    const data = await res.json();

    const grouped = {};

    data.forEach(e => {
        if (!grouped[e.location]) {
            grouped[e.location] = { Janik: "", Tim: "", Nils: "", Niki: "" };
        }
        grouped[e.location][e.player] = e.pokemonName;
    });

    const table = document.getElementById("tableBody");
    table.innerHTML = "";

    Object.keys(grouped).reverse().forEach(route => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${route}</td>
            <td>${grouped[route].Janik}</td>
            <td>${grouped[route].Tim}</td>
            <td>${grouped[route].Nils}</td>
            <td>${grouped[route].Niki}</td>
        `;
        table.appendChild(row);
    });
}

// RESET
function openModal() {
    document.getElementById("modal").style.display = "block";
}

function confirmReset() {
    if (document.getElementById("confirmText").value === "gugugaga") {
        fetch("/reset", { method: "DELETE" }).then(loadData);
        document.getElementById("modal").style.display = "none";
    } else {
        alert("Falsches Wort");
    }
}

// BACKUP
function downloadData() {
    fetch("/data")
    .then(res => res.json())
    .then(data => {
        const blob = new Blob([JSON.stringify(data, null, 2)]);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "backup.json";
        a.click();
    });
}

function uploadData(e) {
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(evt) {
        const json = JSON.parse(evt.target.result);

        fetch("/import", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(json)
        }).then(loadData);
    };

    reader.readAsText(file);
}

loadData();
</script>

</body>
</html>
